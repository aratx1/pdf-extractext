services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=pdf_extractext
    depends_on:
      ollama:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - red_pdfextract
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./docker/ollama-entrypoint.sh:/entrypoint.sh
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
    entrypoint:
      - /bin/sh
      - /entrypoint.sh
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - red_pdfextract
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - red_pdfextract
    restart: unless-stopped

volumes:
  ollama_data:
  mongo_data:
  uploads_data:

networks:
  red_pdfextract:
    external: true
